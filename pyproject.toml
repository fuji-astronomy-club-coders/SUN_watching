[project]
name = "sun_find_west"
version = "1.0.0"
requires-python = ">=3.13"

[tool.pyright]
extraPaths = ["."]
typeCheckingMode = "basic"
pythonVersion = "3.13"


[tool.ruff]
target-version = "py313"
line-length = 112

[tool.ruff.lint]

exclude = [
    "MIN2ver2.py",
]
select = [
    "E",
    "F",
    "B",
    "UP",
    "SIM",
    "PTH",
    "A",
    "ANN",
]
ignore = [
    "BLE","DTZ","E501","I001"
]
