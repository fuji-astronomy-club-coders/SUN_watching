name: Build Windows distribution

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      version: ${{ steps.meta.outputs.version }}
      zip: ${{ steps.meta.outputs.zip }}
      installer: ${{ steps.meta.outputs.installer }}
      checksums: ${{ steps.meta.outputs.checksums }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: "x64"
          cache: "pip"

      - name: Resolve version and artifact names
        id: meta
        shell: pwsh
        run: |
          $version = python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
          Write-Host "Version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "zip=SUN_watching-${version}-windows-x64.zip" >> $env:GITHUB_OUTPUT
          "installer=SUN_watching-${version}-setup-windows-x64.exe" >> $env:GITHUB_OUTPUT
          "checksums=SUN_watching-${version}-SHA256SUMS.txt" >> $env:GITHUB_OUTPUT

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "pyinstaller>=6,<7"

      - name: Install optional ASI camera support
        shell: pwsh
        run: |
          python -m pip install zwoasi
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "zwoasi を導入できませんでした。ダミーカメラのみ対応するバイナリを作成します。"
          }

      - name: Verify Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress --yes --limit-output
          }
          Get-Command iscc | Select-Object -ExpandProperty Source

      - name: Clean previous build output
        shell: pwsh
        run: Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue

      - name: Build executable directory
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean SUN_watching.spec

      - name: Create ZIP package
        shell: pwsh
        env:
          ZIP: ${{ steps.meta.outputs.zip }}
        run: Compress-Archive -Path dist\SUN_watching\* -DestinationPath "dist\$env:ZIP" -Force

      - name: Create installer
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          Write-Host "Building installer version $env:VERSION"
          iscc "/DAppVersion=$env:VERSION" packaging\SUN_watching.iss

      - name: Generate checksums
        shell: pwsh
        env:
          ZIP: ${{ steps.meta.outputs.zip }}
          INSTALLER: ${{ steps.meta.outputs.installer }}
          CHECKSUMS: ${{ steps.meta.outputs.checksums }}
        run: |
          Get-FileHash -Algorithm SHA256 `
            "dist\$env:ZIP", `
            "dist\installer\$env:INSTALLER" |
            ForEach-Object {
              "{0}  {1}" -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf)
            } | Tee-Object -FilePath "dist\$env:CHECKSUMS"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SUN_watching-${{ steps.meta.outputs.version }}-windows-x64
          path: |
            dist/${{ steps.meta.outputs.zip }}
            dist/installer/${{ steps.meta.outputs.installer }}
            dist/${{ steps.meta.outputs.checksums }}
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check tag matches project version
        shell: bash
        env:
          VERSION: ${{ needs.build-windows.outputs.version }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$VERSION" ]; then
            echo "::error::Tag '$tag' does not match pyproject.toml version '$VERSION'."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches version $VERSION."

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: SUN_watching-${{ needs.build-windows.outputs.version }}-windows-x64
          path: dist

      - name: Verify release assets
        shell: bash
        env:
          ZIP: ${{ needs.build-windows.outputs.zip }}
          INSTALLER: ${{ needs.build-windows.outputs.installer }}
          CHECKSUMS: ${{ needs.build-windows.outputs.checksums }}
        run: |
          set -euo pipefail
          test -f "dist/$ZIP"
          test -f "dist/installer/$INSTALLER"
          test -f "dist/$CHECKSUMS"
          ls -lh "dist/$ZIP" "dist/installer/$INSTALLER" "dist/$CHECKSUMS"

      - name: Create GitHub release for version tag
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/${{ needs.build-windows.outputs.zip }}
            dist/installer/${{ needs.build-windows.outputs.installer }}
            dist/${{ needs.build-windows.outputs.checksums }}
