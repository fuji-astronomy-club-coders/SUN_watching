name: Build Windows distribution

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: "x64"
          cache: "pip"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "pyinstaller>=6,<7"

      - name: Install optional ASI camera support
        shell: pwsh
        run: |
          python -m pip install zwoasi
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "zwoasi を導入できませんでした。ダミーカメラのみ対応するバイナリを作成します。"
          }

      - name: Verify Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress --yes --limit-output
          }
          Get-Command iscc | Select-Object -ExpandProperty Source

      - name: Clean previous build output
        shell: pwsh
        run: Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue

      - name: Build executable directory
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean SUN_watching.spec

      - name: Create ZIP package
        shell: pwsh
        run: Compress-Archive -Path dist\SUN_watching\* -DestinationPath dist\SUN_watching-windows-x64.zip -Force

      - name: Create installer
        shell: pwsh
        run: |
          $version = python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
          Write-Host "Building installer version $version"
          iscc "/DAppVersion=$version" packaging\SUN_watching.iss

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 `
            dist\SUN_watching-windows-x64.zip, `
            dist\installer\SUN_watching-setup-windows-x64.exe |
            ForEach-Object {
              "{0}  {1}" -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf)
            } | Tee-Object -FilePath dist\SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SUN_watching-windows-x64
          path: |
            dist/SUN_watching-windows-x64.zip
            dist/installer/SUN_watching-setup-windows-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: SUN_watching-windows-x64
          path: dist

      - name: Create GitHub release for version tag
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/SUN_watching-windows-x64.zip
            dist/installer/SUN_watching-setup-windows-x64.exe
            dist/SHA256SUMS.txt
