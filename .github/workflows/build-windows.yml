name: Build Windows distribution

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: "x64"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pyinstaller

      - name: Install optional ASI camera support
        shell: pwsh
        run: python -m pip install zwoasi
        continue-on-error: true

      - name: Build executable directory
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean SUN_watching.spec

      - name: Create ZIP package
        shell: pwsh
        run: Compress-Archive -Path dist\SUN_watching\* -DestinationPath dist\SUN_watching-windows-x64.zip -Force

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Create installer
        shell: pwsh
        run: iscc packaging\SUN_watching.iss

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SUN_watching-windows-x64
          path: |
            dist/SUN_watching-windows-x64.zip
            dist/installer/SUN_watching-setup-windows-x64.exe
          if-no-files-found: error

      - name: Create GitHub release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/SUN_watching-windows-x64.zip
            dist/installer/SUN_watching-setup-windows-x64.exe
