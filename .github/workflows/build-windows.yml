name: Build Windows distribution

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      version: ${{ steps.meta.outputs.version }}
      zip: ${{ steps.meta.outputs.zip }}
      installer: ${{ steps.meta.outputs.installer }}
      checksums: ${{ steps.meta.outputs.checksums }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: "x64"
          cache: "pip"

      - name: Resolve version and artifact names
        id: meta
        shell: pwsh
        run: |
          $version = python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
          Write-Host "Version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "zip=SUN_watching-${version}-windows-x64.zip" >> $env:GITHUB_OUTPUT
          "installer=SUN_watching-${version}-setup-windows-x64.exe" >> $env:GITHUB_OUTPUT
          "checksums=SUN_watching-${version}-SHA256SUMS.txt" >> $env:GITHUB_OUTPUT

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "pyinstaller>=6,<7"

      - name: Install optional ASI camera support
        shell: pwsh
        run: |
          python -m pip install zwoasi
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "zwoasi を導入できませんでした。ダミーカメラのみ対応するバイナリを作成します。"
          }

      - name: Verify Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress --yes --limit-output
          }
          Get-Command iscc | Select-Object -ExpandProperty Source

      - name: Clean previous build output
        shell: pwsh
        run: Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue

      - name: Validate driver installation helper
        shell: pwsh
        run: |
          $scriptPath = "packaging\install-asi-driver.ps1"
          $null = [scriptblock]::Create((Get-Content -LiteralPath $scriptPath -Raw))
          Write-Host "PowerShell syntax OK: $scriptPath"

      - name: Verify ZWO driver download and signature
        shell: pwsh
        run: |
          # インストール時に取得するドライバの URL と署名を事前確認する。
          # ZWO 側の一時的な障害でビルドを止めないよう、失敗時は警告のみにする。
          try {
            & powershell -NoProfile -ExecutionPolicy Bypass -File packaging\install-asi-driver.ps1 -CheckOnly
            if ($LASTEXITCODE -ne 0) {
              throw "install-asi-driver.ps1 -CheckOnly failed (exit=$LASTEXITCODE)"
            }
          } catch {
            Write-Warning "ZWO ドライバのダウンロード検証に失敗しました: $($_.Exception.Message)"
          }

      - name: Build executable directory
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean SUN_watching.spec

      - name: Stage driver installation helper
        shell: pwsh
        run: |
          $tools = "dist\SUN_watching\tools"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          Copy-Item -LiteralPath "packaging\install-asi-driver.ps1" -Destination (Join-Path $tools "install-asi-driver.ps1") -Force

      - name: Verify packaged files and runtime config
        shell: pwsh
        run: |
          $required = @(
            "dist\SUN_watching\SUN_watching.exe",
            "dist\SUN_watching\_internal\config\config.yaml",
            "dist\SUN_watching\_internal\config\config_schema.json",
            "dist\SUN_watching\_internal\camera\bin\ASICamera2.dll",
            "dist\SUN_watching\tools\install-asi-driver.ps1"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing packaged file: $path"
            }
          }

          # 同梱 DLL がソースと同一で、64bit (AMD64) であることを確認する。
          $sourceDll = "sun_find_west_v2\camera\bin\ASICamera2.dll"
          $packagedDll = "dist\SUN_watching\_internal\camera\bin\ASICamera2.dll"
          $sourceHash = (Get-FileHash -LiteralPath $sourceDll -Algorithm SHA256).Hash
          if ((Get-FileHash -LiteralPath $packagedDll -Algorithm SHA256).Hash -ne $sourceHash) {
            throw "Packaged ASICamera2.dll does not match the source DLL."
          }

          $peBytes = [System.IO.File]::ReadAllBytes($packagedDll)
          $peOffset = [System.BitConverter]::ToInt32($peBytes, 0x3C)
          $machine = [System.BitConverter]::ToUInt16($peBytes, $peOffset + 4)
          if ($machine -ne 0x8664) {
            throw ("Packaged ASICamera2.dll is not x64 (machine=0x{0:X4})." -f $machine)
          }

          $smokeHome = Join-Path $env:RUNNER_TEMP "SUN_watching_smoke_home"
          Remove-Item -Recurse -Force $smokeHome -ErrorAction SilentlyContinue
          $env:SUN_WATCHING_HOME = $smokeHome
          & "dist\SUN_watching\SUN_watching.exe" --check-config
          if ($LASTEXITCODE -ne 0) {
            throw "Frozen executable failed --check-config (exit=$LASTEXITCODE)"
          }
          & "dist\SUN_watching\SUN_watching.exe" --check-imports
          if ($LASTEXITCODE -ne 0) {
            throw "Frozen executable failed --check-imports (exit=$LASTEXITCODE)"
          }
          foreach ($dir in @("data", "data\report")) {
            if (-not (Test-Path -LiteralPath (Join-Path $smokeHome $dir))) {
              throw "Missing runtime directory: $dir"
            }
          }
          # ログは exe と同じフォルダ (dist\SUN_watching\log) に作られる。
          $exeLog = Join-Path (Get-Location) "dist\SUN_watching\log"
          if (-not (Test-Path -LiteralPath $exeLog)) {
            throw "Missing runtime directory: $exeLog"
          }

      - name: Create ZIP package
        shell: pwsh
        env:
          ZIP: ${{ steps.meta.outputs.zip }}
        run: Compress-Archive -Path dist\SUN_watching\* -DestinationPath "dist\$env:ZIP" -Force

      - name: Create installer
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          Write-Host "Building installer version $env:VERSION"
          iscc "/DAppVersion=$env:VERSION" packaging\SUN_watching.iss

      - name: Verify per-user installer without PATH changes
        shell: pwsh
        env:
          INSTALLER: ${{ steps.meta.outputs.installer }}
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "SUN_watching_installed"
          $installLog = Join-Path $env:RUNNER_TEMP "SUN_watching_install.log"
          Remove-Item -Recurse -Force $installDir, $installLog -ErrorAction SilentlyContinue

          $process = Start-Process -FilePath "dist\installer\$env:INSTALLER" -Wait -PassThru -ArgumentList @(
            "/VERYSILENT",
            "/NORESTART",
            "/SP-",
            "/MERGETASKS=!asidriver",
            "/LOG=`"$installLog`"",
            "/DIR=`"$installDir`""
          )
          if ($process.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $installLog) {
              Get-Content -LiteralPath $installLog -Tail 80
            }
            throw "Installer failed with exit code $($process.ExitCode)"
          }

          $smokeHome = Join-Path $env:RUNNER_TEMP "SUN_watching_installed_home"
          Remove-Item -Recurse -Force $smokeHome -ErrorAction SilentlyContinue
          $env:SUN_WATCHING_HOME = $smokeHome
          & "$installDir\SUN_watching.exe" --check-config
          if ($LASTEXITCODE -ne 0) {
            throw "Installed executable failed --check-config (exit=$LASTEXITCODE)"
          }
          & "$installDir\SUN_watching.exe" --check-imports
          if ($LASTEXITCODE -ne 0) {
            throw "Installed executable failed --check-imports (exit=$LASTEXITCODE)"
          }
          foreach ($dir in @("data", "data\report")) {
            if (-not (Test-Path -LiteralPath (Join-Path $smokeHome $dir))) {
              throw "Missing runtime directory after install: $dir"
            }
          }
          $installedLog = Join-Path $installDir "log"
          if (-not (Test-Path -LiteralPath $installedLog)) {
            throw "Missing runtime directory after install: $installedLog"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $installDir "tools\install-asi-driver.ps1"))) {
            throw "Missing installed driver helper: tools\install-asi-driver.ps1"
          }

          $installedDll = Join-Path $installDir "_internal\camera\bin\ASICamera2.dll"
          if (-not (Test-Path -LiteralPath $installedDll)) {
            throw "Missing installed ASICamera2.dll: $installedDll"
          }
          $distDllHash = (Get-FileHash -LiteralPath "dist\SUN_watching\_internal\camera\bin\ASICamera2.dll" -Algorithm SHA256).Hash
          if ((Get-FileHash -LiteralPath $installedDll -Algorithm SHA256).Hash -ne $distDllHash) {
            throw "Installed ASICamera2.dll does not match the build output."
          }

      - name: Generate checksums
        shell: pwsh
        env:
          ZIP: ${{ steps.meta.outputs.zip }}
          INSTALLER: ${{ steps.meta.outputs.installer }}
          CHECKSUMS: ${{ steps.meta.outputs.checksums }}
        run: |
          Get-FileHash -Algorithm SHA256 `
            "dist\$env:ZIP", `
            "dist\installer\$env:INSTALLER" |
            ForEach-Object {
              "{0}  {1}" -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf)
            } | Tee-Object -FilePath "dist\$env:CHECKSUMS"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SUN_watching-${{ steps.meta.outputs.version }}-windows-x64
          path: |
            dist/${{ steps.meta.outputs.zip }}
            dist/installer/${{ steps.meta.outputs.installer }}
            dist/${{ steps.meta.outputs.checksums }}
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check tag matches project version
        shell: bash
        env:
          VERSION: ${{ needs.build-windows.outputs.version }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$VERSION" ]; then
            echo "::error::Tag '$tag' does not match pyproject.toml version '$VERSION'."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches version $VERSION."

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: SUN_watching-${{ needs.build-windows.outputs.version }}-windows-x64
          path: dist

      - name: Verify release assets
        shell: bash
        env:
          ZIP: ${{ needs.build-windows.outputs.zip }}
          INSTALLER: ${{ needs.build-windows.outputs.installer }}
          CHECKSUMS: ${{ needs.build-windows.outputs.checksums }}
        run: |
          set -euo pipefail
          test -f "dist/$ZIP"
          test -f "dist/installer/$INSTALLER"
          test -f "dist/$CHECKSUMS"
          ls -lh "dist/$ZIP" "dist/installer/$INSTALLER" "dist/$CHECKSUMS"

      - name: Create GitHub release for version tag
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/${{ needs.build-windows.outputs.zip }}
            dist/installer/${{ needs.build-windows.outputs.installer }}
            dist/${{ needs.build-windows.outputs.checksums }}
